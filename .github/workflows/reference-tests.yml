name: Reference regression tests

on:
  push:
    branches: [fiscal-document-lifecycle-v0.3]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_integration test_fiscal_ledger
      - run: python generate_examples.py
